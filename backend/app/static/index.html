<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocPilot</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1c1c1a; --muted:#6b6b66; --line:#e4e4df; --accent:#2f5d50; --accent-soft:#e6efeb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --card:#1e1e1c; --ink:#ececea; --muted:#9a9a94; --line:#33332f; --accent:#7fb8a4; --accent-soft:#22302b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { font-weight:600; display:block; margin-bottom:8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text] { flex:1; min-width:200px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:var(--card); font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #docs { margin:12px 0 0; padding:0; list-style:none; color:var(--muted); font-size:14px; }
  #answer { white-space:pre-wrap; min-height:24px; }
  .cite { display:inline-block; background:var(--accent-soft); color:var(--accent); border-radius:6px; padding:0 6px; font-size:12px; font-weight:700; margin:0 1px; }
  .src { border-top:1px solid var(--line); padding:10px 0; font-size:14px; }
  .src.cited { border-left:3px solid var(--accent); padding-left:10px; }
  .meta { color:var(--muted); font-size:12px; margin-bottom:4px; }
  .status { color:var(--muted); font-size:13px; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>DocPilot</h1>
  <p class="sub">Ask questions about your documents. Every answer cites its sources.</p>

  <section class="card">
    <label for="file">Upload a document (PDF, TXT, MD)</label>
    <div class="row">
      <input id="file" type="file" accept=".pdf,.txt,.md">
      <button id="upload">Upload</button>
    </div>
    <div class="status" id="uploadStatus"></div>
    <ul id="docs"></ul>
  </section>

  <section class="card">
    <label for="q">Ask a question</label>
    <form class="row" id="askForm">
      <input id="q" type="text" placeholder="e.g. How many days of paid leave do employees get?" autocomplete="off">
      <button id="ask" type="submit">Ask</button>
    </form>
  </section>

  <section class="card" id="result" hidden>
    <div id="answer"></div>
    <div class="status" id="askStatus"></div>
    <div id="sources"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const withCites = (s) => esc(s).replace(/\[(\d+)\]/g, '<span class="cite">$1</span>');

async function loadDocs() {
  const res = await fetch("/documents");
  const docs = await res.json();
  $("docs").innerHTML = docs.map((d) => `<li>📄 ${esc(d.filename)} · ${d.num_chunks} chunks</li>`).join("");
}

$("upload").onclick = async () => {
  const file = $("file").files[0];
  if (!file) return;
  $("upload").disabled = true;
  $("uploadStatus").textContent = "Uploading and indexing…";
  const body = new FormData();
  body.append("file", file);
  try {
    const res = await fetch("/documents", { method: "POST", body });
    const data = await res.json();
    $("uploadStatus").textContent = res.ok
      ? (data.duplicate ? `Already indexed: ${data.filename}` : `Indexed ${data.filename} into ${data.num_chunks} chunks.`)
      : `Error: ${data.detail}`;
    loadDocs();
  } finally {
    $("upload").disabled = false;
  }
};

function renderSources(sources, cited) {
  $("sources").innerHTML = sources.map((s) => `
    <div class="src ${cited.includes(s.number) ? "cited" : ""}">
      <div class="meta"><span class="cite">${s.number}</span> ${esc(s.filename)}${s.page ? `, page ${s.page}` : ""} · relevance ${s.score.toFixed(2)}</div>
      ${esc(s.content.length > 400 ? s.content.slice(0, 400) + "…" : s.content)}
    </div>`).join("");
}

$("askForm").onsubmit = async (e) => {
  e.preventDefault();
  const question = $("q").value.trim();
  if (!question) return;
  $("ask").disabled = true;
  $("result").hidden = false;
  $("answer").innerHTML = "";
  $("sources").innerHTML = "";
  $("askStatus").textContent = "Searching…";

  let answer = "", sources = [];
  try {
    const res = await fetch("/ask/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split("\n\n");
      buffer = events.pop();
      for (const raw of events) {
        const event = raw.match(/^event: (.*)$/m)?.[1];
        const data = JSON.parse(raw.match(/^data: (.*)$/m)?.[1] || "{}");
        if (event === "sources") { sources = data.sources; renderSources(sources, []); $("askStatus").textContent = "Generating…"; }
        if (event === "token") { answer += data.text; $("answer").innerHTML = withCites(answer); }
        if (event === "done") { renderSources(sources, data.cited); $("askStatus").textContent = `Done in ${data.total_ms} ms`; }
        if (event === "error") { $("askStatus").textContent = `Error: ${data.message}`; }
      }
    }
  } catch (err) {
    $("askStatus").textContent = `Error: ${err.message}`;
  } finally {
    $("ask").disabled = false;
  }
};

loadDocs();
</script>
</body>
</html>
