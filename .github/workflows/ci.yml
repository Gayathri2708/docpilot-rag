name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  eval-gate:
    name: Access-control tests and retrieval eval gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docpilot
          POSTGRES_PASSWORD: docpilot
          POSTGRES_DB: docpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docpilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://docpilot:docpilot@localhost:5432/docpilot
      TEST_DATABASE_URL: postgresql://docpilot:docpilot@localhost:5432/docpilot_test
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
      # Optional: add an LLM_API_KEY repository secret (Groq) to also run the prompt-injection eval.
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_MODEL: openai/gpt-oss-120b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Cache embedding and reranker models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-${{ hashFiles('backend/app/config.py') }}

      - name: Create test database
        run: python -c "import psycopg; psycopg.connect('${{ env.DATABASE_URL }}', autocommit=True).execute('CREATE DATABASE docpilot_test')"
      - name: RBAC integration tests (real Postgres)
        run: pytest -q backend/tests/test_rbac_integration.py

      - name: Start API
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          timeout 180 bash -c 'until curl -sf localhost:8000/health; do sleep 2; done'

      # Fails the build if hit@5 or MRR drops below evals/baseline.json for any mode.
      - name: "Retrieval gate: vector"
        run: >-
          python evals/run_eval.py --retrieval-only --mode vector --baseline evals/baseline.json
          --upload evals/sample_docs/*.md evals/sample_docs/*.pdf
      - name: "Retrieval gate: hybrid"
        run: python evals/run_eval.py --retrieval-only --mode hybrid --baseline evals/baseline.json
      - name: "Retrieval gate: hybrid + rerank"
        run: python evals/run_eval.py --retrieval-only --mode hybrid+rerank --baseline evals/baseline.json

      - name: Prompt-injection eval (needs the LLM_API_KEY secret)
        if: env.LLM_API_KEY != ''
        run: >-
          python evals/run_eval.py --golden evals/injection.jsonl --upload evals/injection_docs/*.md
          --cleanup --strict --delay 2 --label injection

      - name: API log
        if: failure()
        run: cat api.log
