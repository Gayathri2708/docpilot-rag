name: Keep demo awake

# Free Hugging Face Spaces sleep after 48 hours without visits; a daily request keeps the demo
# ready for recruiters. Does nothing until the HF_SPACE repository variable is set.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - name: Request /health
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          host=$(echo "${HF_SPACE}" | tr '[:upper:]' '[:lower:]' | tr '/_.' '---')
          curl -fsS --retry 5 --retry-delay 30 --max-time 120 "https://${host}.hf.space/health"
