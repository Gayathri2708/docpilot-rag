[tool.pytest.ini_options]
pythonpath = ["backend", "evals", "mcp_server"]
testpaths = ["backend/tests", "evals", "mcp_server"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "run_eval", "docpilot_mcp"]
